<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katoptrik – Evidence Workspace</title>
<meta name="description" content="Mehrere Quellen (Text, PDF, Excel, Scans) in strukturierte Tabellen mit eindeutigen IDs überführen, nachvollziehbar berechnen und verknüpfen.">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand">◈ Katoptrik</div>
    <input id="wsName" class="wsname" aria-label="Workspace-Name">
    <select id="profile" class="sel" aria-label="Anwendungsprofil"></select>
    <div class="sp"></div>
    <span id="aiStatus" class="status"></span>
    <button class="btn" id="btnDemo">Beispieldaten</button>
    <button class="btn" id="btnSettings" title="Einstellungen">⚙</button>
    <button class="primary" id="btnImport">＋ Daten</button>
  </header>

  <aside class="left">
    <div class="sec">Arbeitsbereich</div>
    <div class="nav" data-view="canvas">◎ Canvas <span class="count" id="c-links"></span></div>
    <div class="nav" data-view="tables">▤ Tabellen <span class="count" id="c-rows"></span></div>
    <div class="nav" data-view="analyses">▥ Lagebild & Analysen <span class="count" id="c-anl"></span></div>
    <div class="nav" data-view="timeline">◌ Zeitlinie</div>
    <div class="sec">Nachvollziehbarkeit</div>
    <div class="nav" data-view="sources">▣ Quellen <span class="count" id="c-src"></span></div>
    <div class="nav" data-view="corrections">✎ Korrekturen <span class="count" id="c-corr"></span></div>
    <div class="nav" data-view="audit">✓ Audit-Trail</div>
    <div class="sec">Workspace</div>
    <div class="nav" id="btnExport">⇩ Export (JSON)</div>
    <label class="nav" for="importJson">⇧ Import (JSON)</label>
    <input type="file" id="importJson" accept=".json" hidden>
    <div class="nav danger" id="btnReset">✕ Workspace leeren</div>
  </aside>

  <main>
    <div id="banner"></div>
    <div id="view" class="view"></div>
    <div id="inspector" class="inspector"></div>
  </main>

  <button class="mobilechat" id="btnMobileChat">KI-Chat</button>
  <aside class="right" id="chatPanel">
    <div class="chathead">Analyst <span class="pill" id="chatMode"></span><button class="x mobileonly" id="btnCloseChat">×</button></div>
    <div class="chat" id="chat"></div>
    <div class="chips" id="chips"></div>
    <div class="chatbox">
      <textarea id="prompt" placeholder="Frage in natürlicher Sprache, z. B. „Erstelle ein Lagebild“"></textarea>
      <div class="send"><button class="primary" id="btnSend">Senden</button></div>
    </div>
  </aside>
</div>

<div class="modal" id="modal"><div class="card" id="modalCard"></div></div>
<div id="toast" class="toast"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
